<!Doctype html>
<html>
    <script>
        let num=+prompt('Введите число')
        switch(true){
            case num===0 :alert('Вы ввели 0')
            break
            case num===1 :alert('Вы ввели 1')
            break
            case Number.isNaN(num):alert('Дебич')
            break
            default:alert('Введите другое число')
    
        }
        </script>
        </html>
